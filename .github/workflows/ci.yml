name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: python -m pip install reportlab

      - name: Install
        run: npm ci

      - name: Install PDF renderer dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-reportlab

      - name: Run gate
        run: npm run ci:gate
